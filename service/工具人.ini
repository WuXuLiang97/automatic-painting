# [OCR]  # OCR相关设置
# model_version = v5  # OCR模型版本（如v3/v4/v5）
# lang = ch  # 识别语言（ch=中文，en=英文等）
# use_gpu = True  # 是否使用GPU加速
# det_model_dir = C:/Learn/models/PP-OCRv5_server_det  # 检测模型路径
# rec_model_dir = C:/Learn/models/PP-OCRv5_server_rec  # 识别模型路径
# threshold = 0.5  ; 识别置信度阈值（支持分号注释）

[LOG]  # 日志相关设置
output = True  # 是否输出日志到文件
level = INFO  # 日志级别（DEBUG/INFO/WARNING/ERROR）
output_path = C:/Learn/logs/ocr_log.txt  # 日志文件保存路径
rotate = True  # 是否启用日志轮转

[ENV]  # 环境相关设置
# 是否开启调试模式
debug = True  

[SERVER]  # 服务器相关设置
# 服务器主机地址
host = 0.0.0.0  
# 服务器端口
port = 12345  
# 最大工作线程数
max_workers = 4
# 任务队列最大长度
task_queue_size = 20
# 模型预热开关
model_warmup = True