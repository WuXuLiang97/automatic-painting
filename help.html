<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>帮助</title>
    <script>
        // 动态获取当前HTML文件所在目录
        function getImagePath(imageName) {
            // 获取当前页面的URL
            const currentUrl = window.location.href;
            // 截取HTML文件所在的目录路径
            const basePath = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
            // 拼接图片完整路径（假设图片在同级的README_IMAGE文件夹中）
            return basePath + 'README_IMAGE/' + imageName;
        }

        // 页面加载时替换所有图片路径
        window.onload = function() {
            const images = document.getElementsByTagName('img');
            for (let img of images) {
                // 获取图片原文件名（从data-filename属性）
                const fileName = img.getAttribute('data-filename');
                if (fileName) {
                    img.src = getImagePath(fileName);
                }
            }
        }
    </script>
</head>
